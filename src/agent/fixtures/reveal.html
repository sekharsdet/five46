<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Five46 Agent Fixture</title></head>
<body>
  <h1>Simple Reveal</h1>
  <button id="reveal-btn">Show secret message</button>
  <p id="secret" role="status" hidden>The secret message is: agentic testing works.</p>

  <label for="name-input">Your name</label>
  <input id="name-input" type="text" placeholder="Enter your name" />
  <button id="greet-btn">Greet me</button>
  <p id="greeting" role="status"></p>

  <div style="display:none"><button id="hidden-btn">Should never appear</button></div>

  <button id="increment-btn">Increment counter</button>
  <p id="counter" role="status">Count: 0</p>

  <!-- Visible (so it appears in a snapshot, unlike hidden-btn above) but
       permanently disabled — Playwright's own actionability check for
       .click() requires an element be enabled, so a click here always
       times out. Used to test that a genuinely, repeatedly *failing*
       click still trips the stuck-repeating guard, distinct from a
       repeated *succeeding* one. -->
  <button id="disabled-btn" disabled>Disabled button</button>

  <!-- Used by runner.test.ts to verify the browser engine's destructive-
       action gating: a real, clickable button whose name matches
       planner.ts's isDestructiveClickTarget, wired to visibly change page
       state on click so a test can distinguish "blocked, never clicked"
       from "clicked, nothing observable happened." -->
  <button id="delete-account-btn">Delete Account</button>
  <p id="delete-status" role="status">Account active</p>

  <!-- Used by runner.test.ts to verify a real, live-found bug: clicking a
       checkbox *toggles* it, so unlike an additive control (increment-btn
       above), two clicks on the same checkbox net out to no change at
       all — repeating it must never count as "progress" the way a
       repeated successful click on increment-btn legitimately does. -->
  <input id="subscribe-checkbox" type="checkbox" />
  <label for="subscribe-checkbox">Subscribe to updates</label>

  <!-- Used by browser.test.ts/runner.test.ts to verify the `wait` action
       and assert_visible/assert_text's auto-retry: a real, live-found bug
       (the-internet.herokuapp.com's dynamic-loading demo) had content only
       appear after an async client-side delay, which the agent had no tool
       to wait out. 800ms — short enough to keep the suite fast while still
       being definitively "not there yet" at the instant of a click. -->
  <button id="delayed-reveal-btn">Load content</button>
  <p id="delayed-secret" role="status" hidden>Delayed content loaded</p>

  <!-- Used by browser.test.ts/runner.test.ts to verify assert_page_text: a
       real, live-found gap distinct from (and deeper than) the wait-action
       one above — content with no ARIA role and no interactive tag (a
       plain heading, exactly like the-internet.herokuapp.com's own
       `<h4>Hello World!</h4>`) never appears in snapshot()'s outline at
       all (SELECTOR is 'button, a, input, select, textarea, [role]'), so
       no amount of waiting makes it assertable via assert_visible/
       assert_text — only a whole-page text search finds it. Same 800ms
       async delay as delayed-secret above, combining both real gaps in
       one fixture element. -->
  <button id="delayed-heading-btn">Load heading</button>
  <h4 id="delayed-heading" style="display:none">Hello World!</h4>

  <script>
    document.getElementById('delayed-reveal-btn').addEventListener('click', () => {
      setTimeout(() => { document.getElementById('delayed-secret').hidden = false }, 800);
    });
    document.getElementById('delayed-heading-btn').addEventListener('click', () => {
      setTimeout(() => { document.getElementById('delayed-heading').style.display = 'block' }, 800);
    });
    document.getElementById('reveal-btn').addEventListener('click', () => {
      document.getElementById('secret').hidden = false;
    });
    document.getElementById('greet-btn').addEventListener('click', () => {
      const name = document.getElementById('name-input').value || 'stranger';
      document.getElementById('greeting').textContent = 'Hello, ' + name + '!';
    });
    document.getElementById('increment-btn').addEventListener('click', () => {
      const counter = document.getElementById('counter');
      const current = Number(counter.textContent.replace('Count: ', ''));
      counter.textContent = 'Count: ' + (current + 1);
    });
    document.getElementById('delete-account-btn').addEventListener('click', () => {
      document.getElementById('delete-status').textContent = 'Account deleted';
    });
  </script>
</body>
</html>
